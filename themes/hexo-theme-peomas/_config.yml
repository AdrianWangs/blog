favicon: /img/favicon.png

# Logo Mark
mark: "Adrian's Blog"
logo_mark: null

# Scroll button
scroll_top_btn:
  enable: true

# NProgress
nprogress:
  enable: true
  color: '#131313'

# Navigation menu
menu:
  首页: /
  归档: /archives
  分类: /categories
  标签: /tags
  关于我: /about

# Index Page config
index:
  enable_sticky: true
  post_url_target: _self
  enable_category: true
  enable_tag: true

# Tag Page config
tagcloud:
  min_font: 15
  max_font: 30
  unit: px
  start_color: '#337ab7'
  end_color: '#0d6efd'

# About Page config
about:
  avatar:
    enable: true
    link: /img/avatar.png
  title: 小王的Blog
  subTitle: Golang后端开发
  icon:
    - { class: 'fab fa-github', url: 'https://github.com/AdrianWangs', info: "Adrian Wang's Github" }
    - { class: 'fas fa-envelope', url: 'mailto:wyz17601402786@gmail.com', info: 'Mail to me' }
    - { class: 'fas fa-rss', url: '/atom.xml', info: "Subscribe Thomas's blog" }

# Post Page config
toc:
  enable: true
